<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cài đặt · Sổ tài khoản QR chuyển khoản</title>
</head>
<body class="tab-view text-slate-800 antialiased bg-slate-50 font-sans">
  <!-- Extension options page (manifest "options_ui"). Element ids match the shared settings-page.js. -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 flex items-center gap-3 h-14 md:h-16">
      <div class="bg-blue-600 text-white w-9 h-9 rounded-lg flex items-center justify-center shrink-0">
        <i class="fa-solid fa-qrcode text-lg"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-base md:text-lg font-bold text-slate-900 leading-tight">Cài đặt</h1>
        <p class="text-xs text-slate-500 truncate">Sổ tài khoản QR chuyển khoản</p>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 md:py-8 pb-28">
    <div id="settingsRoot" aria-busy="true">
      <p class="text-sm text-slate-500">Đang tải…</p>
    </div>
  </main>

  <div class="fixed inset-x-0 bottom-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 shadow-[0_-4px_14px_rgba(15,23,42,0.06)]" role="region" aria-label="Lưu cài đặt">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-end gap-2">
      <span id="settingsDirty" class="mr-auto text-sm text-amber-700" hidden><i class="fa-solid fa-circle text-[7px] align-middle mr-1.5"></i>Có thay đổi chưa lưu</span>
      <button id="btnResetSettings" class="btn btn-ghost" type="button" disabled>Bỏ thay đổi</button>
      <button id="btnSaveSettings" class="btn btn-primary" type="button" disabled title="Lưu (Ctrl/⌘ + S)">
        <i class="fa-solid fa-check"></i>Lưu cài đặt
      </button>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/options-main.js"></script>
</body>
</html>
